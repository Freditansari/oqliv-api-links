<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>OQLIV Important Data</title>

  <style>
    :root {
      --bg: #070707;
      --card: #111111;
      --card-hover: #171717;
      --border: #292929;
      --text: #f7f7f7;
      --muted: #999999;
      --orange: #ff7a00;
      --orange-hover: #ff922b;
      --green: #27c281;
      --red: #ff5c5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(255, 122, 0, 0.12),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 44px 18px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 122, 0, 0.45);
      border-radius: 22px;

      background: #0c0c0c;
      color: var(--orange);

      font-size: 30px;
      font-weight: 900;
      letter-spacing: -2px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(255, 122, 0, 0.12);
    }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -0.8px;
    }

    .subtitle {
      max-width: 470px;
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      margin-bottom: 14px;
      padding: 18px;

      background: rgba(17, 17, 17, 0.96);
      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
    }

    .label {
      display: block;
      margin-bottom: 8px;

      color: #cfcfcf;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      width: 100%;
      border-radius: 13px;
      font: inherit;
    }

    input,
    select {
      height: 50px;
      padding: 0 14px;

      border: 1px solid #333333;
      outline: none;

      background: #080808;
      color: var(--text);
    }

    input {
      text-transform: uppercase;
    }

    input:focus,
    select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      min-height: 52px;
      padding: 12px 16px;

      border: 0;
      cursor: pointer;

      font-weight: 800;
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .primary {
      margin-top: 16px;
      background: var(--orange);
      color: #090909;
    }

    .primary:hover {
      background: var(--orange-hover);
    }

    .secondary {
      background: #191919;
      color: var(--text);
      border: 1px solid #333333;
    }

    .secondary:hover {
      background: var(--card-hover);
      border-color: #444444;
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;

      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.loading {
      display: block;
      color: #ffd2a6;
      background: rgba(255, 122, 0, 0.1);
      border: 1px solid rgba(255, 122, 0, 0.3);
    }

    .status.error {
      display: block;
      color: #ffb0b0;
      background: rgba(255, 92, 92, 0.1);
      border: 1px solid rgba(255, 92, 92, 0.3);
    }

    .results {
      display: none;
    }

    .results.visible {
      display: block;
    }

    .result-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .ticker-name {
      margin: 0;
      font-size: 24px;
    }

    .as-of {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      flex-shrink: 0;
      padding: 7px 10px;

      border: 1px solid rgba(255, 122, 0, 0.35);
      border-radius: 999px;

      background: rgba(255, 122, 0, 0.09);
      color: var(--orange);

      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      min-height: 94px;
      padding: 14px;

      background: #090909;
      border: 1px solid #262626;
      border-radius: 14px;
    }

    .stat-name {
      color: var(--muted);
      font-size: 12px;
    }

    .stat-value {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -0.4px;
      word-break: break-word;
    }

    .positive {
      color: var(--green);
    }

    .negative {
      color: var(--red);
    }

    .neutral {
      color: var(--text);
    }

    .download-button {
      margin-top: 14px;
    }

    .links {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .link-card {
      display: block;
      padding: 16px 18px;

      color: var(--text);
      text-decoration: none;
      text-align: center;
      font-weight: 750;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;

      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .link-card:hover {
      transform: translateY(-1px);
      background: var(--card-hover);
      border-color: rgba(255, 122, 0, 0.65);
    }

    footer {
      margin-top: 28px;
      color: #707070;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .page {
        padding-top: 30px;
      }

      .grid,
      .stats {
        grid-template-columns: 1fr;
      }

      .stat {
        min-height: 80px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <div class="logo">OQ</div>

      <h1>OQLIV APIs</h1>

      <p class="subtitle">
   
      </p>
    </header>

    <section class="card">
      <form id="dataForm">
        <label class="label" for="ticker">
          Stock ticker
        </label>

        <input
          id="ticker"
          name="ticker"
          type="text"
          value="AAPL"
          placeholder="AAPL"
          autocomplete="off"
          required
        />

        <div class="grid">
          <div>
            <label class="label" for="period">
              Period
            </label>

            <select id="period" name="period">
              <option value="6mo">6 months</option>
              <option value="1y">1 year</option>
              <option value="2y" selected>2 years</option>
              <option value="5y">5 years</option>
              <option value="10y">10 years</option>
              <option value="max">Maximum</option>
            </select>
          </div>

          <div>
            <label class="label" for="interval">
              Interval
            </label>

            <select id="interval" name="interval">
              <option value="1d" selected>Daily</option>
              <option value="5d">5 days</option>
              <option value="1wk">Weekly</option>
              <option value="1mo">Monthly</option>
            </select>
          </div>
        </div>

        <button
          id="loadButton"
          class="primary"
          type="submit"
        >
         Download Data
        </button>

        <div id="status" class="status"></div>
      </form>
    </section>

    <section id="results" class="card results">
      <div class="result-header">
        <div>
          <h2 id="resultTicker" class="ticker-name">
            AAPL
          </h2>

          <div id="resultDate" class="as-of"></div>
        </div>

        <div class="badge">OQLIV Data</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-name">Latest close</div>
          <div id="latestClose" class="stat-value">
            —
          </div>
        </div>

        <div class="stat">
          <div class="stat-name">Cumulative gain</div>
          <div id="cumulativeGain" class="stat-value">
            —
          </div>
        </div>

        <div class="stat">
          <div class="stat-name">Current drawdown</div>
          <div id="currentDrawdown" class="stat-value">
            —
          </div>
        </div>

        <div class="stat">
          <div class="stat-name">Maximum drawdown</div>
          <div id="maximumDrawdown" class="stat-value">
            —
          </div>
        </div>

        <div class="stat">
          <div class="stat-name">Trading records</div>
          <div id="tradingDays" class="stat-value">
            —
          </div>
        </div>

        <div class="stat">
          <div class="stat-name">Next earnings</div>
          <div id="nextEarnings" class="stat-value">
            —
          </div>
        </div>
      </div>

      <button
        id="downloadButton"
        class="secondary download-button"
        type="button"
      >
        Download JSON
      </button>
    </section>

    <section class="links">
      <a
        class="link-card"
        href="https://www.oqliv.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        oqliv.com
      </a>

      <a
        class="link-card"
        href="https://www.patreon.com/oqliv"
        target="_blank"
        rel="noopener noreferrer"
      >
        OQLIV Newsletter
      </a>
    </section>

    <footer>
      Market data is provided for research purposes.
    </footer>
  </main>

  <script>
    /*
      Karena HTML ini dipasang di www.oqliv.com,
      endpoint menggunakan relative URL.
    */
    const API_ENDPOINT =
      "/performance/api/json/price-earnings-drawdowns";

    const dataForm =
      document.getElementById("dataForm");

    const tickerInput =
      document.getElementById("ticker");

    const periodInput =
      document.getElementById("period");

    const intervalInput =
      document.getElementById("interval");

    const loadButton =
      document.getElementById("loadButton");

    const downloadButton =
      document.getElementById("downloadButton");

    const statusBox =
      document.getElementById("status");

    const resultsBox =
      document.getElementById("results");

    let currentRequest = null;

    function buildApiUrl(download = false) {
      const ticker = tickerInput.value
        .trim()
        .toUpperCase();

      const period = periodInput.value;
      const interval = intervalInput.value;

      const query = new URLSearchParams({
        ticker,
        period,
        interval
      });

      if (download) {
        query.set("download", "1");
      }

      return `${API_ENDPOINT}?${query.toString()}`;
    }

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status";

      if (type) {
        statusBox.classList.add(type);
      }
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.className = "status";
    }

    function formatNumber(value, decimals = 2) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "—";
      }

      return number.toLocaleString("en-US", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function formatPercent(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "—";
      }

      const sign = number > 0 ? "+" : "";

      return `${sign}${formatNumber(number, 2)}%`;
    }

    function formatDate(value) {
      if (!value) {
        return "Not available";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function setValueClass(element, value) {
      const number = Number(value);

      element.classList.remove(
        "positive",
        "negative",
        "neutral"
      );

      if (!Number.isFinite(number) || number === 0) {
        element.classList.add("neutral");
      } else if (number > 0) {
        element.classList.add("positive");
      } else {
        element.classList.add("negative");
      }
    }

    function showResults(payload) {
      const metadata = payload.metadata || {};

      document.getElementById("resultTicker").textContent =
        metadata.ticker || tickerInput.value.toUpperCase();

      document.getElementById("resultDate").textContent =
        metadata.price_end_date
          ? `Data through ${formatDate(metadata.price_end_date)}`
          : "";

      document.getElementById("latestClose").textContent =
        formatNumber(
          metadata.latest_adjusted_close ??
          metadata.latest_close
        );

      const cumulativeGain =
        document.getElementById("cumulativeGain");

      cumulativeGain.textContent =
        formatPercent(
          metadata.latest_cumulative_gain_pct
        );

      setValueClass(
        cumulativeGain,
        metadata.latest_cumulative_gain_pct
      );

      const currentDrawdown =
        document.getElementById("currentDrawdown");

      currentDrawdown.textContent =
        formatPercent(
          metadata.latest_drawdown_pct
        );

      setValueClass(
        currentDrawdown,
        metadata.latest_drawdown_pct
      );

      const maximumDrawdown =
        document.getElementById("maximumDrawdown");

      maximumDrawdown.textContent =
        formatPercent(
          metadata.maximum_drawdown_pct
        );

      setValueClass(
        maximumDrawdown,
        metadata.maximum_drawdown_pct
      );

      document.getElementById("tradingDays").textContent =
        metadata.trading_days ??
        payload.prices?.length ??
        "—";

      document.getElementById("nextEarnings").textContent =
        formatDate(
          metadata.next_earnings_date_utc
        );

      resultsBox.classList.add("visible");
    }

    async function loadData(event) {
      event.preventDefault();

      const ticker = tickerInput.value
        .trim()
        .toUpperCase();

      tickerInput.value = ticker;

      if (!ticker) {
        setStatus(
          "Please enter a ticker.",
          "error"
        );

        return;
      }

      if (currentRequest) {
        currentRequest.abort();
      }

      currentRequest = new AbortController();

      loadButton.disabled = true;
      downloadButton.disabled = true;

      setStatus(
        `Loading ${ticker} data...`,
        "loading"
      );

      try {
        const response = await fetch(
          buildApiUrl(false),
          {
            method: "GET",
            headers: {
              Accept: "application/json"
            },
            signal: currentRequest.signal
          }
        );

        const payload = await response.json();

        if (!response.ok) {
          throw new Error(
            payload.detail ||
            payload.error ||
            `Request failed with status ${response.status}`
          );
        }

        showResults(payload);
        clearStatus();

      } catch (error) {
        if (error.name === "AbortError") {
          return;
        }

        resultsBox.classList.remove("visible");

        setStatus(
          error.message || "Unable to load market data.",
          "error"
        );

      } finally {
        loadButton.disabled = false;
        downloadButton.disabled = false;
        currentRequest = null;
      }
    }

    function downloadJson() {
      const ticker = tickerInput.value
        .trim()
        .toUpperCase();

      if (!ticker) {
        setStatus(
          "Please enter a ticker first.",
          "error"
        );

        return;
      }

      /*
        Browser langsung membuka endpoint download.
        Flask akan mengirim file JSON sebagai attachment.
      */
      window.location.href = buildApiUrl(true);
    }

    dataForm.addEventListener(
      "submit",
      loadData
    );

    downloadButton.addEventListener(
      "click",
      downloadJson
    );

    tickerInput.addEventListener(
      "input",
      function () {
        this.value = this.value
          .toUpperCase()
          .replace(/\s+/g, "");
      }
    );
  </script>
</body>
</html>
